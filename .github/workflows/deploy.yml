name: DagangOS affiliate database migration
run-name: Apply DagangOS affiliate D1 schema only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagangos-affiliate-production-d1
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/codex/affiliate-d1-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: migrations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find or provision the affiliate database
        id: database
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync, appendFileSync } from 'node:fs';

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!/^[a-f0-9]{32}$/.test(account || '') || !token) throw new Error('Production Cloudflare credentials are unavailable.');
          const expectedName = 'dagangos-affiliate-production';
          const uuid = /^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$/;
          async function api(path, body) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + path, {
              method: body ? 'POST' : 'GET', redirect: 'error', signal: AbortSignal.timeout(20000),
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            });
            const result = await response.json();
            if (!response.ok || !result.success) {
              const errors = (result.errors || []).map(error => error.code + ' ' + error.message).join(', ');
              throw new Error(path.split('?')[0] + ' HTTP ' + response.status + ' ' + errors);
            }
            return result.result;
          }

          const worker = await api('/workers/scripts/dagangos-portal/settings');
          if (!Array.isArray(worker?.bindings)) throw new Error('Cannot verify production Worker settings.');
          const binding = worker.bindings.find(entry => entry.name === 'AFFILIATE_DB');
          let database;
          if (binding) {
            const id = binding.id || binding.database_id;
            if (binding.type !== 'd1' || !uuid.test(id || '')) throw new Error('The existing affiliate Worker binding is unexpected.');
            database = await api('/d1/database/' + id);
          } else {
            const databases = await api('/d1/database?name=' + expectedName);
            if (!Array.isArray(databases)) throw new Error('Cannot verify the existing D1 inventory.');
            database = databases.find(entry => entry.name === expectedName);
            if (!database) database = await api('/d1/database', { name: expectedName, primary_location_hint: 'apac' });
          }
          if (!uuid.test(database?.uuid || '') || !/^dagangos-[a-z0-9-]*affiliate[a-z0-9-]*$/.test(database?.name || '')
              || /(^|[-])(local|test|preview|sandbox|stage|staging|dev)([-]|$)/.test(database.name)) {
            throw new Error('The selected database is not a DagangOS production affiliate database.');
          }
          writeFileSync('affiliate-migration.wrangler.json', JSON.stringify({
            name: 'dagangos-portal', compatibility_date: '2026-06-27', account_id: account,
            d1_databases: [{ binding: 'AFFILIATE_DB', database_name: database.name, database_id: database.uuid }],
          }));
          appendFileSync(process.env.GITHUB_OUTPUT, 'name=' + database.name + '\n');
          console.log('Migration database', database.name, database.uuid);
          EOF
      - name: Apply and verify the schema
        env:
          MIGRATION_DATABASE: ${{ steps.database.outputs.name }}
        shell: bash
        run: |
          npx --yes wrangler@4.110.0 d1 migrations apply "$MIGRATION_DATABASE" --remote --config affiliate-migration.wrangler.json
          npx --yes wrangler@4.110.0 d1 execute "$MIGRATION_DATABASE" --remote --config affiliate-migration.wrangler.json --json \
            --command "SELECT name FROM d1_migrations ORDER BY id; SELECT id,mode FROM affiliate_products ORDER BY id; SELECT COUNT(*) AS configured_policies FROM affiliate_policy; SELECT COUNT(*) AS saved_attributions FROM affiliate_attributions;" \
            > affiliate-verification.json
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const results = JSON.parse(readFileSync('affiliate-verification.json', 'utf8'));
          const [migrations, products, policy, attributions] = results.map(row => row.results);
          assert.ok(migrations.some(row => row.name === '0001_affiliate_program.sql'));
          assert.ok(migrations.some(row => row.name === '0002_affiliate_attributions.sql'));
          assert.ok(['geraina', 'dapuros', 'web'].every(id => products.some(row => row.id === id)));
          const { database_name, database_id } = JSON.parse(readFileSync('affiliate-migration.wrangler.json', 'utf8')).d1_databases[0];
          const summary = { database_name, database_id, migrations, products, policy, attributions };
          console.log(JSON.stringify(summary));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n```json\n' + JSON.stringify(summary, null, 2) + '\n```\n');
          EOF
