name: Migrate affiliate code registry
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Apply additive code registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute dagangos-affiliate-production --remote --yes --file migrations/0011_affiliate_code_registry.sql
      - name: Verify every current code remains associated with its account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute dagangos-affiliate-production --remote --json --command "SELECT COUNT(*) AS missing FROM affiliates a WHERE NOT EXISTS (SELECT 1 FROM affiliate_code_registry r WHERE r.code = a.code AND r.affiliate_id = a.id)" > code-registry-check.json
          node -e "const x = require('./code-registry-check.json'); if (x[0]?.results?.[0]?.missing !== 0) process.exit(1); console.log('All current affiliate codes are mapped to the correct account.');"
